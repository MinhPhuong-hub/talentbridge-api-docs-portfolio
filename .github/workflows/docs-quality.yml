name: Documentation quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  markdown-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Markdown fences and relative links
        run: python scripts/audit_docs.py
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check OpenAPI examples and local references
        run: |
          python -m pip install -r requirements-docs.txt
          python scripts/check_openapi.py
      - name: Validate every documented JSON and curl example
        run: python scripts/check_markdown_examples.py
      - name: Regression-test example validator
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Lint OpenAPI if present
        shell: bash
        run: |
          if [ -f openapi.yaml ]; then
            npx --yes @redocly/cli@latest lint openapi.yaml
          elif [ -f openapi.yml ]; then
            npx --yes @redocly/cli@latest lint openapi.yml
          else
            echo 'No OpenAPI document at repository root; adjust path in workflow.' >&2
            exit 1
          fi
